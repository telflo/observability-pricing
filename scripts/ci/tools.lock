# The CI's pinned tools, read by scripts/ci/tools.sh. Nothing here is
# installed system-wide: tools.sh fetches each into the git-ignored .tools/
# and checks it against the sha256 below before it may run. A runner and a
# laptop install the same versions with the same sums.
#
# tool <name> <version> <os-arch> <url> <sha256> <sums file> <member> <binary sha256>
#   <sha256> is the downloaded archive's, as the project publishes it in
#   <sums file> (a file of that release); <member> is the one file taken from
#   the .tar.gz; <binary sha256> is that member's own sha256, which
#   `tools.sh path` checks the installed binary against every time.
#   gitleaks: the release's gitleaks_<version>_checksums.txt (the same pins as
#   telflo/telflo's scripts/release/tools.lock).
